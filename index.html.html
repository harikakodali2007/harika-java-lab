2:{t:'JDK Installation',h:`<h3>Program 1: Oracle JDK Installation (Windows)</h3><ol><li>Download the Windows x64 installer from oracle.com/java.</li><li>Run the .exe and click Next through the wizard.</li><li>Set JAVA_HOME to the JDK folder (System Properties → Environment Variables).</li><li>Add %JAVA_HOME%\\bin to Path.</li><li>Verify with <code>java -version</code> and <code>javac -version</code>.</li></ol>
<h3>Program 2: OpenJDK Installation (Windows)</h3><ol><li>Download the OpenJDK zip (e.g. from jdk.java.net or Adoptium).</li><li>Extract to C:\\Java\\openjdk.</li><li>Set JAVA_HOME to that folder.</li><li>Add %JAVA_HOME%\\bin to Path.</li><li>Open a new Command Prompt and run <code>java -version</code>.</li></ol>`},

P('Data Types',String.raw`public class DataTypes {
    public static void main(String[] args) {
        byte b = 10; short s = 200; int i = 3000; long l = 90000L;
        float f = 5.5f; double d = 9.99; char c = 'K'; boolean flag = true;

P('Integer Arithmetic',String.raw`public class IntOps {
    public static void main(String[] args) {
        int a = 20, b = 6;
        System.out.println("Sum = " + (a + b));
        System.out.println("Difference = " + (a - b));
        System.out.println("Product = " + (a * b));
        System.out.println("Quotient = " + (a / b));
        System.out.println("Remainder = " + (a % b));
    }
}`,'Sum = 26\nDifference = 14\nProduct = 120\nQuotient = 3\nRemainder = 2'),

    public static void main(String[] args) {

P('Array of Student Objects',String.raw`class Student {
    int id; String name;
    Student(int id, String name) { this.id = id; this.name = name; }
}
public class Main {
    public static void main(String[] args) {

P('Calculator Using Methods',String.raw`class Calculator {

P('Demonstrating Garbage Collection',String.raw`public class GCDemo {
    public static void main(String[] args) {
        GCDemo obj = new GCDemo();
        System.out.println("Object created");
        obj = null;
        System.out.println("Object eligible for GC");
        System.gc();
        System.out.println("System.gc() requested");

}`,'Object created\nObject eligible for GC\nSystem.gc() requested'),
P('Object Eligibility for Garbage Collection',String.raw`public class Eligible {
    public static void main(String[] args) {
        Eligible a = new Eligible();
        a = null;                       // case 1: nullifying
        System.out.println("Case 1: set to null");
        Eligible b = new Eligible();
        b = new Eligible();             // case 2: reassigning
        System.out.println("Case 2: reassigned");
        new Eligible();                 // case 3: anonymous object
        System.out.println("Case 3: anonymous object");
    }
}`,'Case 1: set to null\nCase 2: reassigned\nCase 3: anonymous object'),

P('Static Methods',String.raw`public class MathOps {
    static int square(int n) { return n * n; }
    static int cube(int n) { return n * n * n; }
    static int fact(int n) { return n == 0 ? 1 : n * fact(n - 1); }
    public static void main(String[] args) {
        System.out.println("Square of 5 = " + square(5));
        System.out.println("Cube of 3 = " + cube(3));
        System.out.println("Factorial of 5 = " + fact(5));
    }
}`,'Square of 5 = 25\nCube of 3 = 27\nFactorial of 5 = 120'),

            while ((b = in.read()) != -1) out.write(b);
            System.out.println("Image copied successfully");

            System.out.println("File not found: " + e.getMessage());

P('Race Condition and Synchronization',String.raw`class Unsafe { int n = 0; void inc() { n++; } }
class Safe { int n = 0; synchronized void inc() { n++; } }
public class Main {
    public static void main(String[] args) throws InterruptedException {
        Unsafe u = new Unsafe(); Safe s = new Safe();
        Runnable r = () -> { for (int i = 0; i < 1000; i++) { u.inc(); s.inc(); } };
        Thread t1 = new Thread(r), t2 = new Thread(r);
        t1.start(); t2.start(); t1.join(); t2.join();
        System.out.println("Without synchronization: " + u.n);
